{
  "plugin_type": "extractors",
  "name": "tap-wordpress-org",
  "namespace": "tap_wordpress_org",
  "variant": "automattic",
  "label": "WordPress.org",
  "docs": "https://hub.meltano.com/extractors/tap-wordpress-org--automattic",
  "repo": "https://github.com/Automattic/tap-wordpress-org",
  "pip_url": "git+https://github.com/Automattic/tap-wordpress-org.git",
  "description": "WordPress.org is the official repository for WordPress plugins, themes, and community resources, providing APIs to access comprehensive data about the WordPress ecosystem.",
  "logo_url": "https://hub.meltano.com/assets/logos/extractors/wordpress-org.png",
  "capabilities": [
    "about",
    "activate-version",
    "batch",
    "catalog",
    "discover",
    "schema-flattening",
    "state",
    "stream-maps"
  ],
  "settings": [
    {
      "name": "api_url",
      "kind": "string",
      "value": "https://api.wordpress.org",
      "label": "API URL",
      "description": "The URL for the WordPress. Org API"
    },
    {
      "name": "batch_config.encoding.compression",
      "kind": "options",
      "label": "Batch Compression Format",
      "description": "Compression format to use for batch files.",
      "options": [
        {
          "label": "GZIP",
          "value": "gzip"
        },
        {
          "label": "None",
          "value": "none"
        }
      ]
    },
    {
      "name": "batch_config.encoding.format",
      "kind": "options",
      "label": "Batch Encoding Format",
      "description": "Format to use for batch files.",
      "options": [
        {
          "label": "JSONL",
          "value": "jsonl"
        },
        {
          "label": "Parquet",
          "value": "parquet"
        }
      ]
    },
    {
      "name": "batch_config.storage.prefix",
      "kind": "string",
      "label": "Batch Storage Prefix",
      "description": "Prefix to use when writing batch files."
    },
    {
      "name": "batch_config.storage.root",
      "kind": "string",
      "label": "Batch Storage Root",
      "description": "Root path to use when writing batch files."
    },
    {
      "name": "events_ip",
      "kind": "string",
      "label": "Events Ip",
      "description": "IP address for events location detection"
    },
    {
      "name": "events_location",
      "kind": "string",
      "label": "Events Location",
      "description": "Location for events search (e.g., 'Seattle, WA')"
    },
    {
      "name": "faker_config.locale",
      "kind": "array",
      "label": "Faker Locale",
      "description": "One or more LCID locale strings to produce localized output for: https://faker.readthedocs.io/en/master/#localization"
    },
    {
      "name": "faker_config.seed",
      "kind": "string",
      "label": "Faker Seed",
      "description": "Value to seed the Faker generator for deterministic output: https://faker.readthedocs.io/en/master/#seeding-the-generator"
    },
    {
      "name": "flattening_enabled",
      "kind": "boolean",
      "label": "Enable Schema Flattening",
      "description": "'True' to enable schema flattening and automatically expand nested properties."
    },
    {
      "name": "flattening_max_depth",
      "kind": "integer",
      "label": "Max Flattening Depth",
      "description": "The max depth to flatten schemas."
    },
    {
      "name": "request_delay",
      "kind": "integer",
      "value": 0.1,
      "label": "Request Delay",
      "description": "Delay between API requests in seconds (default: 0.1)"
    },
    {
      "name": "start_date",
      "kind": "date_iso8601",
      "label": "Start Date",
      "description": "Start date for incremental replication (plugins/themes)"
    },
    {
      "name": "stream_map_config",
      "kind": "object",
      "label": "User Stream Map Configuration",
      "description": "User-defined config values to be used within map expressions."
    },
    {
      "name": "stream_maps",
      "kind": "object",
      "label": "Stream Maps",
      "description": "Config object for stream maps capability. For more information check out [Stream Maps](https://sdk.meltano.com/en/latest/stream_maps.html)."
    },
    {
      "name": "stream_selection",
      "kind": "array",
      "label": "Stream Selection",
      "description": "List of stream names to sync (default: all streams)"
    },
    {
      "name": "user_agent",
      "kind": "string",
      "value": "tap-wordpress-org/0.1.0",
      "label": "User Agent",
      "description": "User agent for API requests"
    }
  ]
}
