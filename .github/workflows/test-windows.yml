name: Test Windows Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install make
        shell: powershell
        run: |
          choco install make -y
          Add-Content $env:GITHUB_PATH "C:\ProgramData\chocolatey\bin"

      - name: Install uv
        shell: powershell
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"

      - name: Test check-uv target (cmd.exe shell)
        shell: cmd
        run: make SHELL=cmd.exe check-uv

      - name: Test setup target (cmd.exe shell)
        shell: cmd
        run: make SHELL=cmd.exe setup
