name: Test Windows Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install make
        shell: powershell
        run: |
          choco install make -y
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Install uv
        shell: powershell
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.local\bin" >> $env:GITHUB_PATH

      - name: Debug PATH and test check-uv
        shell: powershell
        run: |
          echo "PATH: $env:PATH"
          where.exe make
          make check-uv

      - name: Test setup target
        shell: powershell
        run: make setup
